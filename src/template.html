<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App</title>
</head>
<body>
  <form onsubmit="return false">
    <input type="text" placeholder="title" name="todo title" id="title">
    <input type="text" placeholder="description" name="description" id="description">
    <input type="text" placeholder="due date" name="duedate" id="duedate">
    <input type="text" placeholder="priority" name="priority" id="priority">
    <input type="submit" value="create task" id="createTaskButton">
  </form>
</body>
</html>
