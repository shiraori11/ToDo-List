<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App</title>
</head>
<body>
  <div class="website-layout">
    <nav class="side-bar">
      <h1>2DO List</h1>
      <form onsubmit="return false" id="create-task-form">
        <input type="text" placeholder="title" name="todo title" id="title" class="taskInput">
        <input type="text" placeholder="description" name="description" id="description" class="taskInput">
        <input type="text" placeholder="due date" name="duedate" id="duedate" class="taskInput">
        <input type="text" placeholder="priority" name="priority" id="priority" class="taskInput">
        <input type="submit" value="create task" id="createTaskButton">
      </form>     
      <form onsubmit="return false" id="create-project-form">
        <input type="text" placeholder="Project" name="project">
        <input type="submit" value="create project" id="createProjectButton">
      </form>
      <button>Projects</button>
    </nav>
    <div class="contents" id="task-list"></div>
  </div>
  <!-- current logic for adding tasks ongoing-->

</body>
</html>
